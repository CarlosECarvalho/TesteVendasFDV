services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vendas_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Vendas@StrongPass2026!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Vendas@StrongPass2026!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: vendas_backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=VendasDB;User Id=sa;Password=Vendas@StrongPass2026!;TrustServerCertificate=True;MultipleActiveResultSets=true;
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: vendas_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mssql_data:
